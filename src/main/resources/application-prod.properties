spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

stripe.api-key=${STRIPE_API_KEY}
stripe.price-id=${STRIPE_PRICE_ID}
stripe.product-id=${STRIPE_PRODUCT_ID}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
server.port=${PORT:8080}
server.address=0.0.0.0
email.from=${APP_EMAIL_FROM:}
email.resend.api-key=${RESEND_API_KEY:}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:}
security.jwt.cookie-secure=${SECURITY_JWT_COOKIE_SECURE:true}

management.health.mail.enabled=false
