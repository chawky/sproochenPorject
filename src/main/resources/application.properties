spring.application.name=sproochenCoach
# Database - dev specific
spring.datasource.url=jdbc:mysql://localhost:3306/sproochencoach?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.show-sql= true
spring.jpa.generate-ddl=true

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=3600000
###########email config customapppw
# SMTP server configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

security.otp.expiration-ms=300000

######AI
##Prompts
ai.prompts.speaking-generation=classpath:prompts/speaking-generation.txt
ai.prompts.listening-generation=classpath:prompts/listening-generation.txt
ai.prompts.exercise-generation=classpath:prompts/exercise-generation.txt
ai.prompts.vocabulary-generation=classpath:prompts/vocabulary-generation.txt
ai.prompts.speaking-evaluation=classpath:prompts/speaking-evaluation.txt
ai.prompts.transcription=classpath:prompts/groq-transcription.txt
ai.prompts.image-generation=classpath:prompts/image-generation.txt
ai.prompts.image-description-evaluation=classpath:prompts/image-description-evaluation.txt
##LLM provider switch: openrouter or kimi
ai.chat.provider=kimi
ai.chat.temperature=0.2
##openrouter
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.base-url=https://openrouter.ai/api/v1
ai.openrouter.completion-uri=/chat/completions
ai.openrouter.image-uri=/images
ai.openrouter.free.model=openrouter/free
ai.openrouter.paid.model=openrouter/paid
ai.openrouter.model=${ai.openrouter.free.model}
ai.openrouter.image-model=bytedance-seed/seedream-4.5
##kimi / zenmux anthropic-compatible API
ai.kimi.api-key=${KIMI_API_KEY:}
ai.kimi.base-url=https://zenmux.ai/api/anthropic
ai.kimi.base-image-url=https://zenmux.ai/api/v1
ai.kimi.messages-uri=/v1/messages
ai.kimi.image-uri=/images/generations
ai.kimi.anthropic-version=2023-06-01
ai.kimi.paid.model=moonshotai/kimi-k3
ai.kimi.image-model=gpt-image-2
ai.kimi.max-tokens=4096
ai.kimi.thinking-enabled=false
ai.kimi.thinking-budget-tokens=1024
ai.system.content=You are an expert Luxembourgish (Lëtzebuergesch) language tutor. You must write authentic, grammatically correct Luxembourgish using standard Luxembourgish spelling. Never invent Luxembourgish words. Never mix Luxembourgish with German, French, Dutch, or other languages. Keep the language appropriate to the requested CEFR level.
ai.system.image-content=you generating an image for sproochentest of luxembourg
#grok
ai.groq.api-key=${GROQ_API_KEY}
ai.groq.base-url=https://api.groq.com/openai/v1
ai.elevenlabs.base-url=https://api.elevenlabs.io/v1
ai.elevenlabs.api-key=${ELEVENLABS_API_KEY}
ai.elevenlabs.voice-id=JBFqnCBsd6RMkjVDRZzb

######Luxembourg locations
luxembourg.geoportail.base-url=https://apiv4.geoportail.lu
luxembourg.geoportail.fulltext-search-uri=/fulltextsearch
luxembourg.geoportail.location-layers=Localité,Commune,Adresse,nom_de_rue
luxembourg.geoportail.default-limit=10
luxembourg.geoportail.max-limit=50
#####Stripe config
stripe.api-key=${STRIPE_API_KEY}
stripe.price-id=${STRIPE_PRICE_ID}
stripe.success-url=http://localhost:4200/payment/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:4200/payment/cancel
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
